<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sprint Planner">
  <!--
    Square без rounded corners + полный фон до краёв = непрозрачный PNG при растеризации.
    rx-маску ОС/браузер накладывает сам; локальный rx делает PNG-углы прозрачными
    (alpha=0) и Windows показывает «пустую плитку». См. docs/RELEASE_NOTES.md → 8.29.5.
    Бренд v8.31.2 (owner, концепт «Отбор бэклога»): кремовая карточка со строками
    задач — две отобраны в спринт (зелёные чеки), одна исключена (красный круг
    с крестом). Палитра sage shadcn: #246b59 / #fdfaf2 / #0f7a5b / #b33939.
  -->
  <rect width="512" height="512" fill="#246b59"/>
  <rect x="72" y="72" width="368" height="368" rx="46" fill="#fdfaf2"/>
  <circle cx="150" cy="158" r="32" fill="#0f7a5b"/>
  <polyline points="134,158 146,170 168,144" fill="none" stroke="#fdfaf2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="212" y1="158" x2="396" y2="158" stroke="#3f5552" stroke-width="24" stroke-linecap="round"/>
  <circle cx="150" cy="256" r="32" fill="#0f7a5b"/>
  <polyline points="134,256 146,268 168,242" fill="none" stroke="#fdfaf2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="212" y1="256" x2="356" y2="256" stroke="#3f5552" stroke-width="24" stroke-linecap="round"/>
  <circle cx="150" cy="354" r="32" fill="none" stroke="#b33939" stroke-width="14"/>
  <line x1="128" y1="376" x2="172" y2="332" stroke="#b33939" stroke-width="14" stroke-linecap="round"/>
  <line x1="212" y1="354" x2="312" y2="354" stroke="#d9d2c3" stroke-width="24" stroke-linecap="round"/>
</svg>
