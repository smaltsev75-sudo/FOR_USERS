<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sprint Planner (maskable)">
  <!--
    Maskable safe-zone: круг радиуса ~205 в центре (40% от 512).
    Полезный контент сжат до 64% (scale 0.64, translate чтобы остаться в центре)
    и помещается в безопасный круг с запасом. Фон занимает весь viewport,
    чтобы маска ОС обрезала фон, а не контент.
  -->
  <rect width="512" height="512" fill="#246b59"/>
  <g transform="translate(92,92) scale(0.64)">
    <rect x="102" y="96" width="308" height="216" rx="24" fill="#fdfaf2"/>
    <line x1="126" y1="164" x2="386" y2="164" stroke="#d9d2c3" stroke-width="10" stroke-linecap="round"/>
    <circle cx="205" cy="246" r="24" fill="#0f7a5b"/>
    <circle cx="307" cy="246" r="24" fill="#b33939"/>
    <polyline points="154,384 230,452 358,332" fill="none" stroke="#fdfaf2" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
